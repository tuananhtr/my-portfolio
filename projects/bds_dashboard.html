<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCMC Real Estate Market Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #111217;
            --text-main: #ffffff;
            --text-muted: #8b8d96;
            --accent-orange: #ff471a; 
            --border-color: #2a2c35;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace; 
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
        }

        h1 { 
            text-align: left; 
            margin-bottom: 20px; 
            color: var(--text-main); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-size: 24px;
        }

        /* --- Grid Layout --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 equal columns for the 3 KPIs */
            gap: 20px;
            margin-bottom: 20px;
        }

        /* --- Cards --- */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .kpi-card { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            position: relative; 
        }
        
        /* Decorative corner squares */
        .kpi-card::before, .kpi-card::after {
            content: ''; 
            position: absolute; 
            width: 4px; 
            height: 4px; 
            background: var(--text-muted);
        }
        .kpi-card::before { top: -1px; left: -1px; }
        .kpi-card::after { bottom: -1px; right: -1px; }

        .kpi-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .kpi-value { font-size: 32px; font-weight: bold; color: var(--text-main); }
        
        /* --- Chart Containers --- */
        .chart-container-half { grid-column: span 2; height: auto; min-height: 450px; }
        .chart-container-full { grid-column: span 3; height: auto; min-height: 600px; padding-bottom: 30px; }

        /* --- Controls --- */
        .controls { margin-bottom: 15px; }
        select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100%;
            max-width: 300px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HCMC Apartment Market Overview</h1>

    <div class="dashboard-grid">
        <div class="card kpi-card">
            <div class="kpi-title">Total Processed Listings</div>
            <div class="kpi-value" id="kpi-total">--</div>
        </div>
        <div class="card kpi-card">
            <div class="kpi-title">Market Avg Price / m²</div>
            <div class="kpi-value" id="kpi-price">--</div>
        </div>
        <div class="card kpi-card">
            <div class="kpi-title">Total Projects Tracked</div>
            <div class="kpi-value" id="kpi-projects">--</div>
        </div>

        <div class="card chart-container-full">
            <div class="controls">
                <label for="projectSelect" style="color: var(--text-muted); text-transform: uppercase; font-size: 12px; letter-spacing: 1px; margin-right: 10px;">Analyze specific project:</label>
                <select id="projectSelect">
                    <option value="ALL">All Market Data</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 20px; flex-wrap: wrap; width: 100%;">
                <div id="lineChart" style="flex: 1; min-width: 400px; height: 500px;"></div>
                <div id="volumeChart" style="flex: 1; min-width: 400px; height: 500px;"></div>
            </div>
        </div>

        <div class="card chart-container-full" style="width: 100%; overflow: hidden;">
            <div id="mapChart" style="width: 100%; min-height: 600px;"></div>
        </div>
    </div>
</div>

<script>
    // Format large numbers cleanly
    const formatCurrency = (num) => new Intl.NumberFormat('vi-VN').format(Math.round(num));

    // Fetch the JSON file generated by your Python script
    // Note: Adjusted path to look inside your real_estate_crawl folder
    fetch('../real_estate_crawl/hcm_real_estate_data.json')
        .then(response => response.json())
        .then(data => {
            
            // --- 1. DATA CLEANING & PREP ---
            const cleanData = data.filter(d => d.Price_per_m2 > 0 && d.Latitude && d.Longitude);

            // --- 2. CALCULATE KPIs ---
            let totalPriceM2 = 0;
            let uniqueProjects = new Set();

            cleanData.forEach(row => {
                totalPriceM2 += Number(row.Price_per_m2) || 0;
                
                if (row.Project_Name && row.Project_Name !== "N/A") {
                    uniqueProjects.add(row.Project_Name);
                }
            });

            document.getElementById('kpi-total').innerText = cleanData.length.toLocaleString();
            document.getElementById('kpi-price').innerText = `${formatCurrency((totalPriceM2 / cleanData.length) / 1000000)} Tr`;
            document.getElementById('kpi-projects').innerText = uniqueProjects.size.toLocaleString();

            // --- 3. POPULATE DROPDOWN ---
            const selectElement = document.getElementById('projectSelect');
            Array.from(uniqueProjects).sort().forEach(name => {
                let option = document.createElement('option');
                option.value = name;
                option.text = name;
                selectElement.appendChild(option);
            });

            // Helper function to translate Vietnamese dates to YYYY-MM-DD
            function parsePostedDate(dateStr) {
                if (!dateStr || dateStr === "N/A") return null;
                let str = dateStr.toLowerCase();
                let today = new Date();

                if (str.includes("hôm nay") || str.includes("giờ") || str.includes("phút")) {
                    return today.toISOString().split('T')[0];
                } else if (str.includes("hôm qua")) {
                    let yesterday = new Date(today);
                    yesterday.setDate(yesterday.getDate() - 1);
                    return yesterday.toISOString().split('T')[0];
                } else {
                    let match = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
                    if (match) {
                        let day = match[1].padStart(2, '0');
                        let month = match[2].padStart(2, '0');
                        let year = match[3];
                        return `${year}-${month}-${day}`;
                    }
                }
                return null;
            }

            // --- 4. DRAW LINE CHARTS (Price & Volume) ---
            function updateLineChart(selectedProject) {
                let filteredData = selectedProject === "ALL" 
                    ? cleanData 
                    : cleanData.filter(d => d.Project_Name === selectedProject);

                // Group prices and counts by Date
                let groupedByDate = {};
                filteredData.forEach(d => {
                    let date = parsePostedDate(d.Posted_Date);
                    let rawPrice = Number(d.Price_Raw);
                    let rawArea = Number(d.Area_Raw);
                    
                    if (!date || !rawPrice || !rawArea) return; 
                    
                    let calculatedPriceM2 = rawPrice / rawArea;
                    
                    if (!groupedByDate[date]) groupedByDate[date] = { sum: 0, count: 0 };
                    
                    groupedByDate[date].sum += calculatedPriceM2;
                    groupedByDate[date].count += 1;
                });

                let dates = Object.keys(groupedByDate).sort();
                let avgPrices = dates.map(date => groupedByDate[date].sum / groupedByDate[date].count);
                let postCounts = dates.map(date => groupedByDate[date].count); 

                // --- Chart 1: Price / m2 (Gray/White theme) ---
                let tracePrice = {
                    x: dates, y: avgPrices, type: 'scatter', mode: 'lines+markers',
                    fill: 'tozeroy',                              // <-- Tells Plotly to fill down to the x-axis
                    fillcolor: 'rgba(139, 141, 150, 0.15)',       // <-- A faint, transparent gray glow
                    marker: { color: '#ffffff', size: 6 },
                    line: { color: '#8b8d96', width: 2 },
                    name: 'Avg Price'
                };

                let layoutPrice = {
                    title: { text: 'Price Trend (VND / m²)', font: { color: '#ffffff' } },
                    autosize: true, margin: { t: 40, b: 45, l: 80, r: 20 },
                    xaxis: { gridcolor: '#2a2c35', tickangle: -45, tickfont: { color: '#8b8d96' } },
                    yaxis: { gridcolor: '#2a2c35', tickfont: { color: '#8b8d96' } },
                    plot_bgcolor: 'rgba(0,0,0,0)', paper_bgcolor: 'rgba(0,0,0,0)'
                };

                Plotly.newPlot('lineChart', [tracePrice], layoutPrice, {responsive: true});

                // --- Chart 2: Listing Volume (Orange theme) ---
                let traceVolume = {
                    x: dates, y: postCounts, type: 'scatter', mode: 'lines+markers',
                    fill: 'tozeroy', fillcolor: 'rgba(255, 71, 26, 0.1)',
                    marker: { color: '#ff471a', size: 6 }, 
                    line: { color: '#ff471a', width: 2 },
                    name: '# of Listings'
                };

                let layoutVolume = {
                    title: { text: 'Listing Volume Over Time', font: { color: '#ffffff' } },
                    autosize: true, margin: { t: 40, b: 45, l: 50, r: 20 },
                    xaxis: { gridcolor: '#2a2c35', tickangle: -45, tickfont: { color: '#8b8d96' } },
                    yaxis: { gridcolor: '#2a2c35', tickfont: { color: '#8b8d96' } },
                    plot_bgcolor: 'rgba(0,0,0,0)', paper_bgcolor: 'rgba(0,0,0,0)'
                };

                Plotly.newPlot('volumeChart', [traceVolume], layoutVolume, {responsive: true});
            }

            // --- 5. DRAW MAP ---
            function drawMap() {
                let latsHigh = [], lonsHigh = [], pricesHigh = [], sizesHigh = [], hoverHigh = [];
                let latsLow = [], lonsLow = [], sizesLow = [], hoverLow = [];

                cleanData.forEach(d => {
                    let rawPrice = Number(d.Price_Raw);
                    let rawArea = Number(d.Area_Raw);
                    
                    if (rawPrice > 0 && rawArea > 0 && d.Latitude && d.Longitude) {
                        let calculatedPriceM2 = rawPrice / rawArea;
                        
                        // Ignore extreme fake data typos (e.g. anything over 500 Million VND/m2)
                        if (calculatedPriceM2 <= 500000000) {
                            
                            let priceInTr = (calculatedPriceM2 / 1000000).toFixed(1);
                            let name = d.Project_Name && d.Project_Name !== 'N/A' ? d.Project_Name : 'Listing';
                            let hoverText = `<b>${name}</b><br>Price: ${priceInTr} Tr/m²`;

                            if (calculatedPriceM2 > 60000000) {
                                latsHigh.push(d.Latitude);
                                lonsHigh.push(d.Longitude);
                                pricesHigh.push(calculatedPriceM2);
                                
                                let scaledSize = (calculatedPriceM2 / 20000000); 
                                sizesHigh.push(scaledSize > 30 ? 30 : (scaledSize < 6 ? 6 : scaledSize));
                                
                                hoverHigh.push(hoverText);
                            } else {
                                latsLow.push(d.Latitude);
                                lonsLow.push(d.Longitude);
                                sizesLow.push(6);
                                hoverLow.push(hoverText);
                            }
                        }
                    }
                });

                // Trace for LOWER prices (Bright Orange to match the image)
                let traceLow = {
                    type: 'scattermapbox', lat: latsLow, lon: lonsLow, mode: 'markers',
                    marker: { size: sizesLow, color: '#ff471a', opacity: 0.9 },
                    text: hoverLow, hoverinfo: 'text'
                };

                // Trace for HIGHER prices (Inferno colorscale fits dark themes perfectly)
                // Trace for HIGHER prices (Inferno colorscale fits dark themes perfectly)
                let traceHigh = {
                    type: 'scattermapbox', lat: latsHigh, lon: lonsHigh, mode: 'markers',
                    marker: {
                        size: sizesHigh, color: pricesHigh,
                        colorscale: 'Inferno', 
                        cmin: 0, cmax: 500000000, 
                        showscale: false, /* <-- Turned off the color bar here */
                        opacity: 0.85
                    },
                    text: hoverHigh, hoverinfo: 'text'
                };

                let layoutMap = {
                    title: { text: 'Ho Chi Minh City apartment price heatmap', font: {color: '#ffffff'} },
                    autosize: true, margin: { t: 40, b: 0, l: 0, r: 0 },
                    mapbox: {
                        style: 'carto-darkmatter', 
                        center: {lat: 10.779047, lon: 106.707337}, zoom: 10
                    },
                    showlegend: false,
                    plot_bgcolor: 'rgba(0,0,0,0)', paper_bgcolor: 'rgba(0,0,0,0)'
                };

                Plotly.newPlot('mapChart', [traceLow, traceHigh], layoutMap, {responsive: true});
            }

            // --- INITIALIZATION ---
            drawMap();
            updateLineChart("ALL");

            // Event listener for dropdown
            selectElement.addEventListener('change', function() {
                updateLineChart(this.value);
            });

            // --- Force Plotly to resize when the window resizes ---
            window.addEventListener('resize', function() {
                let mapDiv = document.getElementById('mapChart');
                let lineDiv = document.getElementById('lineChart');
                let volDiv = document.getElementById('volumeChart'); 
                
                if (mapDiv.data) Plotly.Plots.resize(mapDiv);
                if (lineDiv.data) Plotly.Plots.resize(lineDiv);
                if (volDiv.data) Plotly.Plots.resize(volDiv);        
            });

        })
        .catch(error => console.error('Error loading JSON:', error));
</script>

</body>
</html>
